[General]
network = sdnddos.DDoSNetwork
sim-time-limit = 60s

# The OpenFlow model's switch and controller reference an overlay icon named
# openflow/OpenFlow-Logo-small, but ship it at images/OpenFlow-Logo-small.png -
# without the openflow/ subfolder the name implies. Nothing resolves it, and the
# GUI draws a red "?" over both nodes. images/openflow/ holds a copy at the path
# the name actually asks for. Relative to this file.
image-path = ../images

# Every run draws its own random stream, so repetitions differ in traffic
# timing, attack start and packet sizes. A single run proves nothing; the
# experiment scripts sweep repetitions and report mean and spread.
repeat = 5
seed-set = ${repetition}

output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca

# ---------------------------------------------------------------- topology
**.numNormal = 3
**.numAttacker = 2

# Explicit addressing - see the comments in ipv4config.xml for why this is
# not optional with an OpenFlow switch in the path.
*.configurator.config = xmldoc("ipv4config.xml")

# The configurator does not recognise an OpenFlow switch as a bridge, so it
# treats every host-to-switch cable as a separate link and by default refuses
# to reuse one subnet across them. Our hosts genuinely do share one layer-2
# domain, so that restriction has to be lifted or nothing can talk.
*.configurator.assignDisjunctSubnetAddresses = false

# One subnet behind a layer-2 switch means there is nothing to route, and
# routes computed through a switch it misunderstands are bogus anyway.
*.configurator.addStaticRoutes = false

# ------------------------------------------------------------- OpenFlow
# The switch dials the controller by module name; INET resolves it.
**.sw.OF_Switch.connectAddress = "controller"
**.sw.OF_Switch.connectAt = 0.1s
**.sw.OF_Switch.serviceTime = 0.000035s
**.sw.OF_Switch.bufferCapacity = 3712

**.controller.serviceTime = 0.000005556s

# This exact app stack is the one every working scenario in the model uses.
# LearningSwitch looks like the obvious choice for a single switch, but it is
# referenced by no scenario in the project and segfaults when paired with
# ARPResponder - the ARP app drops the packet-in that LearningSwitch then
# dereferences. Do not "simplify" this back to LearningSwitch.
**.controller.numControllerApps = 3
**.controller.controllerApps[0].typename = "LLDPForwarding"
**.controller.controllerApps[0].flowModIdleTimeOut = 5
**.controller.controllerApps[0].ignoreArpRequests = true
**.controller.controllerApps[1].typename = "LLDPAgent"
**.controller.controllerApps[1].flowModIdleTimeOut = 140
**.controller.controllerApps[2].typename = "ARPResponder"

**.sw.etherMAC[*].promiscuous = true
**.sw.tcp.mss = 800
**.arp.cacheTimeout = 60s

# ------------------------------------------------------------- the victim
# Two services on different ports:
#   6000 - echo, so legitimate clients get answered (bidirectional flows)
#   5000 - sink, which absorbs the flood and never replies (one-way flows)
#
# This started out as a TCP server for realistic request/response traffic, but
# INET's TCP does not work over this path: the connection establishes and then
# the first data request never reaches the server app (verified with the
# flood-everything controller, so it is not the OpenFlow forwarding). UDP echo
# gives the same bidirectional property without the dependency.
**.victim.numUdpApps = 2
**.victim.udpApp[0].typename = "UDPSink"
**.victim.udpApp[0].localPort = 5000
**.victim.udpApp[1].typename = "UDPEchoApp"
**.victim.udpApp[1].localPort = 6000

# --------------------------------------------------------- normal clients
# Request/response TCP, not one-way UDP. This matters: with one-way normal
# traffic the pair_flow feature is 0 for every single flow, attack and normal
# alike, and carries no information. Real clients get answered, floods do not,
# and that difference is exactly what the feature is meant to capture.
# Two kinds of legitimate traffic, on purpose:
#
#   udpApp[0] - interactive: sent to the echo port and answered, so these
#               flows are bidirectional and pair_flow reads 1.
#   udpApp[1] - one-way telemetry or a media stream, never answered.
#
# The second one matters. With every normal flow answered, pair_flow separates
# the classes perfectly on its own and the model comparison says nothing. Real
# networks carry plenty of unanswered UDP, and including it keeps the feature
# informative rather than decisive.
**.normalHost[*].numUdpApps = 2

**.normalHost[*].udpApp[0].typename = "UDPBasicApp"
**.normalHost[*].udpApp[0].destAddresses = "victim"
**.normalHost[*].udpApp[0].destPort = 6000
**.normalHost[*].udpApp[0].localPort = 6100
**.normalHost[*].udpApp[0].messageLength = 500B
**.normalHost[*].udpApp[0].sendInterval = exponential(0.05s)
**.normalHost[*].udpApp[0].startTime = uniform(2s, 4s)

**.normalHost[*].udpApp[1].typename = "UDPBasicApp"
**.normalHost[*].udpApp[1].destAddresses = "victim"
**.normalHost[*].udpApp[1].destPort = 5000
**.normalHost[*].udpApp[1].messageLength = 200B
**.normalHost[*].udpApp[1].sendInterval = exponential(0.4s)
**.normalHost[*].udpApp[1].startTime = uniform(2s, 5s)

# --------------------------------------------------------------- attackers
# UDP flood: small packets, very high rate, starting well after normal
# traffic has settled so the before/after is obvious in the results.
**.attacker[*].numUdpApps = 1
**.attacker[*].udpApp[0].typename = "UDPBasicApp"
**.attacker[*].udpApp[0].destAddresses = "victim"
**.attacker[*].udpApp[0].destPort = 5000
# Randomised, not fixed. A constant send interval produces a flood whose
# pkt_rate is literally the same number every interval, with zero variance -
# trivially learnable and nothing like a real attack.
**.attacker[*].udpApp[0].messageLength = intuniform(64B, 400B)
**.attacker[*].udpApp[0].sendInterval = exponential(0.0008s)
**.attacker[*].udpApp[0].startTime = uniform(18s, 22s)

# ---------------------------------------------------------------- recording
**.scalar-recording = true
**.vector-recording = true


# ========================================================================
# Detector. Added as a fourth controller app; the three forwarding apps are
# untouched, so detection is genuinely a bolt-on and the baseline configs
# stay comparable.
# ========================================================================
[Config WithDetector]
description = "Base for every detector run - not meant to be run directly"
**.sw.OF_Switch.statsInterval = 1s

**.controller.numControllerApps = 4
**.controller.controllerApps[3].typename = "DDoSDetectorApp"
**.controller.controllerApps[3].attackerModules = "DDoSNetwork.attacker[0] DDoSNetwork.attacker[1]"
**.controller.controllerApps[3].blockDuration = 10s


# ========================================================================
# Step 1: produce the training data. Observes and labels from ground truth,
# blocks nothing - the traffic must run undisturbed or the dataset would only
# ever contain attacks that were already being stopped.
# ========================================================================
[Config Collect]
description = "Write the labelled flow dataset, no mitigation"
extends = WithDetector
**.controller.controllerApps[3].mode = "collect"
**.controller.controllerApps[3].writeCsv = true
**.controller.controllerApps[3].csvFile = "../data/flows_sim.csv"


# ========================================================================
# Step 2: the actual comparison. Same network, same attack, same everything
# except which model decides.
# ========================================================================
[Config DecisionTree]
description = "Supervised detection + blocking"
extends = WithDetector
**.controller.controllerApps[3].mode = "dt"

[Config KMeans]
description = "Unsupervised detection + blocking"
extends = WithDetector
**.controller.controllerApps[3].mode = "kmeans"

# ========================================================================
# Hybrid: both detectors, each used where it is strong.
#
# The tree never raised a false positive but is blind to attacks outside its
# training; K-Means sees those but flags some legitimate flows. So the tree
# blocks on sight, and K-Means alone must see the same flow stay anomalous for
# several consecutive reports before it may block. Attacks persist; a bursty
# client does not.
# ========================================================================
[Config Hybrid]
description = "Tree blocks immediately, K-Means needs corroboration over time"
extends = WithDetector
**.controller.controllerApps[3].mode = "hybrid"
**.controller.controllerApps[3].confirmations = 3

# ========================================================================
# Expected-cost rule (expectimax at depth one).
#
# Rather than thresholding a yes/no, score both actions and take the cheaper.
# Allowing a flow costs the bytes it will deliver to the victim; blocking one
# costs a fixed penalty for cutting off what might be a real user. Because the
# first term scales with the flow's own rate, a loud suspicious flow is blocked
# on weaker evidence than a quiet one.
# ========================================================================
[Config CostRule]
description = "Block when the expected cost of allowing exceeds that of blocking"
extends = WithDetector
**.controller.controllerApps[3].mode = "cost"
# 30,000 rather than something round: the sweep in Sweep_Cost showed 200,000
# demands near-certainty against a quiet attack (~14 kB/s) and the rule never
# fires, while 30,000 catches half of it for 0.4 false positives per run.
**.controller.controllerApps[3].falseBlockCost = 30000


# ========================================================================
# Second attack type: low-rate flood.
#
# This is the case the whole comparison exists for. At full rate the attack is
# 500x louder than normal traffic and any threshold separates it. Slowed by a
# factor of 25 it sits close to legitimate traffic, and the models have to
# actually discriminate rather than notice a huge number.
#
# The models are NOT retrained for it - they see the full-rate attack in
# training and this one only at test time, which is exactly the "attack you
# were not trained on" question.
#
# A TCP SYN flood was the original plan for the second attack type. It is not
# here because INET's TCP does not work over this path at all (see the victim
# app comments above), and because a genuinely spoofed half-open SYN flood
# would need a raw-IP injector that INET does not provide. Claiming one would
# be dishonest; a low-rate flood is both truthful and more interesting.
# ========================================================================
[Config LowRateFlood]
description = "Attack at 1/25th the rate - close to legitimate traffic"
**.attacker[*].udpApp[0].sendInterval = exponential(0.02s)

[Config LowRate_Collect]
description = "Dataset for the low-rate attack"
extends = LowRateFlood, Collect
**.controller.controllerApps[3].csvFile = "../data/flows_lowrate.csv"

[Config LowRate_DT]
description = "Low-rate attack vs Decision Tree"
extends = LowRateFlood, DecisionTree

[Config LowRate_KMeans]
description = "Low-rate attack vs K-Means"
extends = LowRateFlood, KMeans

[Config LowRate_Hybrid]
description = "Low-rate attack vs the hybrid"
extends = LowRateFlood, Hybrid

[Config LowRate_Cost]
description = "Low-rate attack vs the expected-cost rule"
extends = LowRateFlood, CostRule

# ========================================================================
# How cautious should the hybrid be? confirmations = 1 is plain K-Means, and
# larger values trade recall for fewer false positives. Sweeping it traces the
# whole frontier between the two detectors with one parameter.
#
# Only the low-rate attack is swept: against the full-rate attack the tree
# fires immediately, the K-Means path is never reached, and the value of
# confirmations makes no difference at all.
# ========================================================================
[Config Sweep_Confirmations]
description = "Hybrid patience vs the low-rate attack"
extends = LowRateFlood, Hybrid
**.controller.controllerApps[3].confirmations = ${conf = 1, 2, 3, 5}

# ========================================================================
# The cost rule's behaviour is entirely governed by falseBlockCost, and the
# scale that matters is the flow's own byte rate. A quiet attack delivers
# ~14 kB/s, so a penalty of 200,000 demands near-certainty before blocking
# and the rule never fires - it behaves exactly like the tree. Sweeping the
# penalty across the range that brackets the attack's byte rate is what shows
# the rule actually working.
# ========================================================================
[Config Sweep_Cost]
description = "Expected-cost rule vs the low-rate attack, across penalties"
extends = LowRateFlood, CostRule
**.controller.controllerApps[3].falseBlockCost = ${cost = 2000, 8000, 30000, 200000}


# ========================================================================
# Intensity sweep.
#
# Two data points (full-rate and 1/25) show that the supervised model breaks
# somewhere in between, but not where. Sweeping the send interval turns the
# headline into a curve and locates the cliff edge.
#
# The models are trained once, on the full-rate attack. Nothing is retrained
# per intensity - that is the whole point.
#
# 0.0008s is the rate used in training; the rest are 1/5, 1/10, 1/25 and 1/50
# of it.
# ========================================================================
[Config Sweep_DT]
description = "Decision Tree across attack intensities"
extends = DecisionTree
**.attacker[*].udpApp[0].sendInterval = exponential(${interval = 0.0008, 0.004, 0.008, 0.02, 0.04}s)

[Config Sweep_KMeans]
description = "K-Means across attack intensities"
extends = KMeans
**.attacker[*].udpApp[0].sendInterval = exponential(${interval = 0.0008, 0.004, 0.008, 0.02, 0.04}s)


# ========================================================================
# Presentation configs.
#
# The research runs spend 20 simulated seconds on warm-up before the attack,
# which is fine headless but wastes most of a live demo. These start clients
# at 1 s and the attack at 5 s, so the whole story fits in 15 simulated
# seconds - short enough to watch animated, start to finish.
#
# Nothing else changes, so what happens on screen is what the real runs do.
# ========================================================================
[Config Demo]
description = "Compressed timeline for live demonstration"
**.normalHost[*].udpApp[0].startTime = uniform(1s, 1.5s)
**.normalHost[*].udpApp[1].startTime = uniform(1s, 2s)
**.attacker[*].udpApp[0].startTime = uniform(5s, 5.5s)
repeat = 1

[Config Demo_NoProtection]
description = "1 of 4: the attack, unopposed"
extends = Demo, NoProtection

[Config Demo_DecisionTree]
description = "2 of 4: supervised detection stops the familiar attack"
extends = Demo, DecisionTree

[Config Demo_LowRate_DT]
description = "3 of 4: the same model is blind to a quieter attack"
extends = Demo, LowRate_DT

[Config Demo_LowRate_Cost]
description = "4 of 4: the expected-cost rule catches it"
extends = Demo, LowRate_Cost


# ==========================================================================
# Diagnostic: dumbest possible controller - flood everything, install no
# flows. Proves whether the data path and ARP work at all, independent of
# any forwarding logic.
# ==========================================================================
[Config HubOnly]
description = "Flood-everything controller, for verifying the data path"
**.controller.numControllerApps = 1
**.controller.controllerApps[0].typename = "Hub"


# ==========================================================================
# Baseline: attack runs unopposed. This is what damage looks like with no
# detection at all, and every other configuration is measured against it.
# ==========================================================================
[Config NoProtection]
description = "Attack runs, nothing stops it"
extends = General


# ==========================================================================
# Control: no attackers at all. Establishes what healthy looks like, so a
# false positive later has something to be compared against.
# ==========================================================================
[Config NoAttack]
description = "Normal traffic only, no attackers"
extends = General
**.numAttacker = 0
